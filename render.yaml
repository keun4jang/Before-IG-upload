# Render Blueprint — 전체 스택 배포 (web + worker + Postgres + Redis)
# render.com → New → Blueprint → 이 저장소 선택 시 자동 구성됩니다.
# (데모만 원하면 Vercel 이 더 간단합니다. DEPLOY.md 참고)
databases:
  - name: big-db
    databaseName: big
    user: big
    plan: free

services:
  - type: redis
    name: big-redis
    plan: free
    ipAllowList: [] # 내부 서비스만 접근

  - type: web
    name: big-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DEMO_MODE
        value: '0'
      - key: NEXT_PUBLIC_APP_URL
        sync: false # 배포 후 실제 URL 로 설정
      - key: DATABASE_URL
        fromDatabase:
          name: big-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: big-redis
          property: connectionString
      - key: OCR_PROVIDER
        value: dummy
      - key: LLM_PROVIDER
        value: none
      - key: SEARCH_PROVIDER
        value: none

  - type: worker
    name: big-worker
    runtime: docker
    dockerfilePath: ./apps/worker/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: big-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: big-redis
          property: connectionString
